name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # Which parts a pull request touches, so the slow jobs run only when they test something that
    # changed. A job skipped by `if:` counts as passed for required checks. Pushes to main, changes
    # to this file, and a failure of this job run everything.
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.diff.outputs.dart }}
      web: ${{ steps.diff.outputs.web }}
      ios: ${{ steps.diff.outputs.ios }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          all=0
          files=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            all=1
          else
            # The pull request's merge commit: its first parent is the base branch.
            files=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$files" | grep -qx '.github/workflows/ci.yml' && all=1
          fi
          match() {
            if [ "$all" = 1 ] || printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          {
            echo "dart=$(match '^(packages/flutter/|conformance/|spec/)')"
            echo "web=$(match '^(packages/(core|web|react)/|apps/playground/|package(-lock)?\.json$)')"
            echo "ios=$(match '^(packages/engine-ios/|packages/expo/ios/|conformance/fixtures/(reframe|auto-reframe/signals-))')"
            echo "android=$(match '^(packages/engine-android/|packages/expo/android/|conformance/fixtures/(reframe|auto-reframe/signals-))')"
          } | tee -a "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @cutiva/playground
      - run: npm run build:website

  dart:
    # The Dart core (Flutter SDK): analysis, formatting, unit tests, conformance fixtures, coverage.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dart == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.2
      - run: npm run test:dart

  ios:
    # The iOS engine (Swift package): crop keys against the conformance fixtures, exports checked for
    # sync, speed, gaps, mixing and reframed crops, and the reframe analyzer. On macOS, then on an
    # iOS simulator.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/engine-ios
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Tests on an iOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -scheme CutivaEngine -destination "platform=iOS Simulator,id=$udid" -quiet

  android:
    # The Android engine: JVM unit tests, then exports on an emulator checked for sync, gaps, speed,
    # mixing and reframed crops, and the reframe analyzer (the MediaPipe test downloads the model).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/engine-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :engine:testDebugUnitTest :reframe:testDebugUnitTest --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          working-directory: packages/engine-android
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ./gradlew :engine:connectedDebugAndroidTest :reframe:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-results
          path: |
            packages/engine-android/engine/build/reports/androidTests
            packages/engine-android/reframe/build/reports/androidTests

  e2e:
    # macOS: Google Chrome there has the platform H.264 and AAC encoders that export needs.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chrome is preinstalled on the runner; Firefox and WebKit come from Playwright.
      - run: npx -w @cutiva/playground playwright install firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results

  e2e-platforms:
    # Discovery across operating systems and browsers. Not a required check yet: results feed
    # the browser support page. Runs on pushes to main only, not on every pull request.
    if: github.event_name == 'push'
    name: e2e (${{ matrix.os }}, ${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, project: chrome }
          - { os: windows-latest, project: edge }
          - { os: windows-latest, project: firefox }
          - { os: ubuntu-latest, project: chrome }
          - { os: ubuntu-latest, project: firefox }
          - { os: macos-latest, project: edge }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.project == 'firefox'
        run: npx -w @cutiva/playground playwright install --with-deps firefox
      - if: matrix.os == 'macos-latest' && matrix.project == 'edge'
        run: npx -w @cutiva/playground playwright install msedge
      - run: npm run e2e
        env:
          E2E_BROWSERS: ${{ matrix.project }}
