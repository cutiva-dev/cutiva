name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @cutiva/playground
      - run: npm run build:website

  e2e:
    # macOS: Google Chrome there has the platform H.264 and AAC encoders that export needs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chrome is preinstalled on the runner; Firefox and WebKit come from Playwright.
      - run: npx -w @cutiva/playground playwright install firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results

  e2e-platforms:
    # Discovery across operating systems and browsers. Not a required check yet: results feed
    # the browser support page.
    name: e2e (${{ matrix.os }}, ${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, project: chrome }
          - { os: windows-latest, project: edge }
          - { os: windows-latest, project: firefox }
          - { os: ubuntu-latest, project: chrome }
          - { os: ubuntu-latest, project: firefox }
          - { os: macos-latest, project: edge }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.project == 'firefox'
        run: npx -w @cutiva/playground playwright install --with-deps firefox
      - if: matrix.os == 'macos-latest' && matrix.project == 'edge'
        run: npx -w @cutiva/playground playwright install msedge
      - run: npm run e2e
        env:
          E2E_BROWSERS: ${{ matrix.project }}
